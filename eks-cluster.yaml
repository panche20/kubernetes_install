apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: observability
  region: us-east-1
  version: "1.34" # Use an active EKS version (e.g., 1.30–1.34)

availabilityZones:
  - us-east-1a
  - us-east-1b

iam:
  withOIDC: true

managedNodeGroups:
  - name: observability-ng-private
    instanceType: m7i-flex.large

    desiredCapacity: 2
    minSize: 2
    maxSize: 3

    volumeSize: 50
    privateNetworking: true

    amiFamily: Ubuntu2404 # Fixed: Must specify exact Ubuntu version/casing

    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        albIngress: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
